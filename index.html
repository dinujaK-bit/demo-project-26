<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day of the Week Finder</title>

    <!-- 1. Bootstrap CSS FIRST -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (so Instagram/Facebook icons actually show up) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 2. Your custom CSS SECOND -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="main-content">
        <main class="card">
            <header class="card-header">
                <h1>Day Finder</h1>
                <p>Enter any date to discover the day of the week</p>
            </header>

            <div class="input-grid">
                <div class="input-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" placeholder="2026">
                </div>

                <div class="input-group">
                    <label for="month">Month</label>
                    <input type="number" id="month" placeholder="1 - 12" min="1" max="12">
                </div>

                <div class="input-group">
                    <label for="date">Date</label>
                    <input type="number" id="date" placeholder="1 - 31" min="1" max="31">
                </div>
            </div>

            <button id="btn_submit" onclick="setday()">Find Day</button>

            <div id="result" class="result-box" aria-live="polite"></div>
        </main>
    </div>

    <div class="container">
        <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
            <div class="col-md-4 d-flex align-items-center">
                <a href="/" class="mb-3 me-2 mb-md-0 text-decoration-none lh-1" aria-label="Bootstrap">
                    <i class="bi bi-calendar-event fs-4"></i>
                </a>
                <span class="mb-3 mb-md-0">© 2026 Company, Inc</span>
            </div>

            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                <li class="ms-3">
                    <a href="#" aria-label="Instagram"><i class="bi bi-instagram fs-5"></i></a>
                </li>
                <li class="ms-3">
                    <a href="#" aria-label="Facebook"><i class="bi bi-facebook fs-5"></i></a>
                </li>
            </ul>
        </footer>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
